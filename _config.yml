# --- Site settings ---------------------------------------------------------
# Project Pages: served from the public repo `writeups` at /writeups.

title: Scott Egan
tagline: Offensive security, AI red teaming, vulnerability research
description: >-
  Offensive security write-ups by Scott Egan: penetration testing, AI and ML red teaming,
  firmware reverse engineering, and vulnerability research method.
url: "https://blackhawkyama.github.io"
baseurl: "/writeups"

author:
  name: Scott Egan
  # email: you@example.com

# --- Theme -----------------------------------------------------------------
# minima is built into GitHub Pages and works with zero extra setup.
# To upgrade to a sharper technical-blog theme later, see README.md.
theme: minima
minima:
  skin: dark
  social_links:
    github: blackhawkyama

# --- Build -----------------------------------------------------------------
markdown: kramdown
permalink: /posts/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Show these pages in the top nav
header_pages:
  - about.md
  - topics.md

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
